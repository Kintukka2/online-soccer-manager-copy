<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Cloudflare Pages serves this page at whatever address was not found,
     however deep, so relative links would resolve against a folder that
     does not exist. The base puts them back at the site root. -->
<base href="/">
<title>Page not found — OSMWiz for Online Soccer Manager</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#011D30">
<!-- Navy before the stylesheet arrives, and navy if it never does: a white
     flash, or a white page, is the one way this cannot look like OSMWiz.
     The link colour is sky, because the browser's own blue all but vanishes
     on navy; the stylesheet's own rule replaces it when it loads. -->
<style>body{background:#0A1A2D;color:#fff}a{color:#5AC8FA}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Saira+Condensed:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css?v=0.1.0">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="/" aria-label="OSMWiz home"><i>OSM</i>WIZ</a>
  </div>
</header>

<main class="wrap">
  <h1 class="masthead__title">Page not found</h1>
  <p class="lede">Check the link for a typo, or start again from the home page.</p>
  <p><a class="btn" href="/"><span>Back to OSMWiz</span></a></p>
</main>

</body>
</html>
